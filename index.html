<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOP PMO Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4caf50" />
  <link rel="icon" href="icon-192.png.png" />
  <style>
    body {
      font-family: sans-serif;
      background-color: #121212;
      color: white;
      text-align: center;
      padding: 2rem;
    }
    .streak {
      font-size: 2rem;
      font-weight: bold;
      margin-top: 1rem;
    }
    button {
      padding: 1rem;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <h1>STOP PMO Tracker</h1>
  <div>Hari ke-<span id="days"></span></div>
  <div class="streak">🔥 Streak: <span id="streak">0</span> hari</div>
  <button onclick="reset()">Reset Progress</button>

  <script>
    const startDateKey = "stopStartDate";
    const streakKey = "stopStreak";

    const today = new Date().setHours(0, 0, 0, 0);
    let start = localStorage.getItem(startDateKey);
    let streak = parseInt(localStorage.getItem(streakKey)) || 0;

    if (!start) {
      start = today;
      localStorage.setItem(startDateKey, start);
    }

    const daysPassed = Math.floor((today - start) / (1000 * 60 * 60 * 24));
    document.getElementById("days").textContent = daysPassed;

    if (daysPassed > streak) {
      streak = daysPassed;
      localStorage.setItem(streakKey, streak);
    }

    document.getElementById("streak").textContent = streak;

    function reset() {
      if (confirm("Yakin mau reset?")) {
        localStorage.setItem(startDateKey, today);
        localStorage.setItem(streakKey, 0);
        location.reload();
      }
    }
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("serviceWorker.js")
        .then(() => console.log("Service Worker Registered"));
    }
  </script>
</body>
</html>
